[package]
name = "t22-remittance"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "t22_remittance"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.2"
anchor-spl = { version = "1.2.2", features = ["token_2022", "token_2022_extensions"]}

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-zk-sdk = "7"
spl-token-2022-interface = "3.1"
spl-token-confidential-transfer-proof-generation = "0.6"
spl-token-confidential-transfer-proof-extraction = "0.6"
solana-zk-elgamal-proof-interface = "0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
